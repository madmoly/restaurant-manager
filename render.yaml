services:
  - type: web
    name: restaurant-manager
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run db:push && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-manager-db
          property: connectionString

databases:
  - name: restaurant-manager-db
    plan: starter
    databaseName: restaurant_manager
    # Note: Render provides PostgreSQL.
    # MySQL을 쓰려면 Railway 또는 PlanetScale 연동 필요.
    # Render 사용 시 Drizzle dialect를 postgresql로 변경해야 함.
